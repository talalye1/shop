        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #d5d6d0;
            font-family: 'Arial', sans-serif;
        }

        .container {
            max-width: 60px;
            margin: 20px auto;
            padding: 20px;
        }

        .main-image {
            width: 100%;
            height: 100%px;
            border-radius: 0px;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0s;
        }

        .main-image:hover {
            transform: scale(0.098);
        }

        .title {
            text-align: center;
            margin: 0px 0;
            color: #333;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 0px;
            margin: 0px 0;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 0px;
            cursor: pointer;
            transition: all 0s;
        }

        .like-btn {
            background-color: #ff4757;
            color: white;
        }

        .share-btn {
            background-color: #2ed573;
            color: white;
        }

        .download-btn {
            background-color: #3742fa;
            color: white;
        }

        /* Popup Styles */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            z-index: 1000;
        }

        .popup-content {
            position: relative;
            max-width: 90%;
            margin: 2% auto;
            background: white;
            border-radius: 0px;
            padding: 0px;
            animation: popup 0.3s ease-out;
        }

        @keyframes popup {
            from {transform: scale(0.5); opacity: 0;}
            to {transform: scale(1); opacity: 1;}
        }

        .similar-images {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0px;
            margin-top: 0px;
        }

        .similar-img {
            width: 100%;
            height: 100%px;
            object-fit: cover;
            border-radius: 0px;
            cursor: pointer;
        }

        .close-btn {
            position: absolute;
            top: 0px;
            right: 0px;
            font-size: 0px;
            cursor: pointer;
            color: #333;
        }
