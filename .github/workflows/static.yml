      position: relative;
      margin: 0px 
    }
    .page {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-size: cover;
      background-position: center;
      display: none;
    }
    .page.active {
      display: block;
    }
    #controls {
      position: absolute;
      top: 5px;
      right: 5px;
    }
    #print-btn {
      margin-left: 5px;
    }
    #zoom-btn {
      margin-left: 0px;
